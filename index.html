<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gendy Drone</title>
<style>
  :root { --bg:#eef1f4; --panel:#fff; --ink:#17212b; --mute:#5d6b79; --line:#cfd6dd; --draw:#2b6cb0; --out:#c2410c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:680px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.intro { margin:0 0 16px; color:var(--mute); max-width:62ch; }
  button { font:inherit; padding:10px 22px; border:0; border-radius:6px; background:var(--ink); color:#fff; cursor:pointer; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline:3px solid var(--draw); outline-offset:2px; }
  canvas { display:block; width:100%; height:140px; background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-top:16px; }
  details { margin-top:22px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 14px 14px; }
  summary { cursor:pointer; font-weight:600; }
  canvas.in { margin-top:10px; }
  .ctl { display:grid; grid-template-columns:120px 1fr 74px; gap:8px; align-items:center; margin-top:10px; }
  .ctl output { text-align:right; font-variant-numeric:tabular-nums; color:var(--mute); }
  .lock { display:grid; grid-template-columns:120px 1fr 74px; margin-top:4px; }
  .lock button { grid-column:2; justify-self:start; padding:3px 9px; background:transparent; color:var(--mute); border:1px solid var(--line); line-height:0; }
  .lock button[aria-pressed="true"] { color:var(--ink); border-color:var(--ink); }
  input[type=range] { width:100%; }
</style>
</head>
<body>
<main>
  <h1>Gendy Drone</h1>
  <p class="intro">Xenakis-style stochastic oscillator, the same as <code>Gendy1.ar(1,1,1,1,[40,40],[40,40],0.5,0.5)</code> in SuperCollider. Left and right run as two independent copies. Use headphones or a larger speaker.</p>
  <button id="go">Start sound</button>
  <canvas id="cScope"></canvas>

  <details open><summary>Oscillator</summary><div id="oscCtls"></div></details>
  <details open><summary>EQ</summary><canvas id="cEq" class="in"></canvas><div id="eqCtls"></div></details>
  <details open><summary>Reverb</summary><div id="rvCtls"></div></details>
  <details open><summary>Low-pass filter</summary><div id="lpCtls"></div></details>
</main>

<script>
// ---------- Gendy1 as an AudioWorklet (Cauchy distributions, 50 stored control points, knum of them in use) ----------
const workletSrc = `
class Gendy extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    const f = n => ({ name: n, defaultValue: 40, minValue: 0.01, maxValue: 20000, automationRate: 'k-rate' });
    const s = n => ({ name: n, defaultValue: 0.5, minValue: 0, maxValue: 1, automationRate: 'k-rate' });
    return [f('minL'), f('minR'), f('maxL'), f('maxR'), s('ampscale'), s('durscale'),
      { name: 'knum', defaultValue: 12, minValue: 1, maxValue: 50, automationRate: 'k-rate' }];
  }
  constructor() {
    super();
    this.ch = [0, 1].map(() => ({
      amps: Float32Array.from({ length: 50 }, () => Math.random() * 2 - 1),
      durs: Float32Array.from({ length: 50 }, () => Math.random()),
      idx: 0, phase: 1, amp: 0, next: 0, speed: 0
    }));
  }
  cauchy() {                                    // adparam / ddparam = 1
    const f = Math.min(Math.max(Math.random(), 0.0001), 0.9999);
    return Math.tan(Math.atan(10) * (2 * f - 1)) * 0.1;
  }
  mirror(v, lo, hi) {                           // fold back into the range
    if (v >= lo && v <= hi) return v;
    const r = hi - lo; let x = (v - lo) % (2 * r); if (x < 0) x += 2 * r;
    return lo + (x > r ? 2 * r - x : x);
  }
  process(_, outputs, p) {
    const out = outputs[0], K = Math.min(50, Math.max(1, Math.round(p.knum[0])));
    const mins = [p.minL[0], p.minR[0]], maxs = [p.maxL[0], p.maxR[0]];
    const as = p.ampscale[0], ds = p.durscale[0];
    for (let c = 0; c < 2; c++) {
      const s = this.ch[c], o = out[c];
      for (let i = 0; i < o.length; i++) {
        if (s.phase >= 1) {
          s.phase -= 1;
          s.idx = (s.idx + 1) % K;
          s.amp = s.next;
          s.next = s.amps[s.idx] = this.mirror(s.amps[s.idx] + as * this.cauchy(), -1, 1);
          const d = s.durs[s.idx] = this.mirror(s.durs[s.idx] + ds * this.cauchy(), 0, 1);
          s.speed = Math.min(1, (mins[c] + (maxs[c] - mins[c]) * d) * K / sampleRate);
        }
        o[i] = s.amp + (s.next - s.amp) * s.phase;   // linear interpolation between breakpoints
        s.phase += s.speed;
      }
    }
    return true;
  }
}
registerProcessor('gendy', Gendy);`;

// ---------- parameters ----------
const P = { minL: 40, minR: 40, maxL: 40, maxR: 40, ampscale: 0.5, durscale: 0.5, knum: 12, vol: 0.3, lpFreq: 20000, lpDepth: 60,
            rvMix: 0.35, rvDecay: 12, rvPre: 40, rvDamp: 5000, rvLow: 150 };
[80, 250, 2000, 6000].forEach((f, i) => { P["eq" + i + "f"] = f; P["eq" + i + "g"] = 0; });

// ---------- audio ----------
let ctx = null, gendy, hp, eqF = [], dry, dly, conv, wLow, wHigh, wet, out, an, irTimer, fxSum, lpDry, lpWet, lpA, lpB;
const eqTypes = ["lowshelf", "peaking", "peaking", "highshelf"];

function makeIR(c, decay) {                       // long, dense stereo tail that darkens over time
  const sr = c.sampleRate, len = Math.floor(sr * decay * 1.2), buf = c.createBuffer(2, len, sr);
  const g = Math.pow(10, -3 / (decay * sr)), ga = Math.exp(-1 / (sr * decay * 0.25));
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch); let y = 0, env = 1, a = 0.9;
    for (let i = 0; i < len; i++) {
      y += (0.1 + a) * ((Math.random() * 2 - 1) - y) * 0.5;
      d[i] = y * env * Math.min(1, i / (sr * 0.2));
      env *= g; a *= ga;
    }
  }
  return buf;
}
function scheduleIR() { clearTimeout(irTimer); irTimer = setTimeout(() => { if (ctx) conv.buffer = makeIR(ctx, P.rvDecay); }, 250); }
function setLpf() {                               // depth = how far the highs are pushed down (0 to -60 dB)
  if (!ctx) return;
  const floor = Math.pow(10, -P.lpDepth / 20);
  lpA.frequency.value = lpB.frequency.value = P.lpFreq;
  lpDry.gain.value = floor; lpWet.gain.value = 1 - floor;
}
function setMix() { if (!ctx) return; dry.gain.value = Math.cos(P.rvMix * Math.PI / 2); wet.gain.value = Math.sin(P.rvMix * Math.PI / 2); }

let blobUrl = null;
async function startAudio() {
  ctx = new AudioContext();
  blobUrl = blobUrl || URL.createObjectURL(new Blob([workletSrc], { type: "application/javascript" }));
  await ctx.audioWorklet.addModule(blobUrl);
  gendy = new AudioWorkletNode(ctx, "gendy", { numberOfInputs: 0, outputChannelCount: [2] });
  ["minL", "minR", "maxL", "maxR", "ampscale", "durscale", "knum"].forEach(k => gendy.parameters.get(k).value = P[k]);

  hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 8;      // removes DC offset
  eqF = eqTypes.map((t, i) => {
    const b = ctx.createBiquadFilter(); b.type = t; b.Q.value = 1;
    b.frequency.value = P["eq" + i + "f"]; b.gain.value = P["eq" + i + "g"]; return b;
  });
  dry = ctx.createGain();
  dly = ctx.createDelay(0.5); dly.delayTime.value = P.rvPre / 1000;
  conv = ctx.createConvolver(); conv.buffer = makeIR(ctx, P.rvDecay);
  wLow = ctx.createBiquadFilter(); wLow.type = "highpass"; wLow.frequency.value = P.rvLow;
  wHigh = ctx.createBiquadFilter(); wHigh.type = "lowpass"; wHigh.frequency.value = P.rvDamp;
  wet = ctx.createGain();
  out = ctx.createGain(); out.gain.value = P.vol;
  fxSum = ctx.createGain();
  lpDry = ctx.createGain(); lpWet = ctx.createGain();
  lpA = ctx.createBiquadFilter(); lpA.type = "lowpass"; lpA.Q.value = -5.34;   // two Butterworth stages (Q in dB) = 24 dB/oct
  lpB = ctx.createBiquadFilter(); lpB.type = "lowpass"; lpB.Q.value = 2.33;
  setLpf();
  an = ctx.createAnalyser(); an.fftSize = 2048;
  setMix();

  // Gendy -> EQ -> reverb (dry + wet) -> low-pass -> volume
  gendy.connect(hp); hp.connect(eqF[0]); eqF[0].connect(eqF[1]); eqF[1].connect(eqF[2]); eqF[2].connect(eqF[3]);
  eqF[3].connect(dry); dry.connect(fxSum);
  eqF[3].connect(dly); dly.connect(conv); conv.connect(wLow); wLow.connect(wHigh); wHigh.connect(wet); wet.connect(fxSum);
  fxSum.connect(lpDry); lpDry.connect(out);                          // floor path (0 to -60 dB)
  fxSum.connect(lpA); lpA.connect(lpB); lpB.connect(lpWet); lpWet.connect(out);
  out.connect(an); out.connect(ctx.destination);
}
function stopAudio() { if (ctx) { ctx.close(); ctx = null; gendy = null; eqF = []; } }

const go = document.getElementById("go");
go.onclick = async () => {
  go.disabled = true;
  if (ctx) { stopAudio(); go.textContent = "Start sound"; }
  else { await startAudio(); go.textContent = "Stop sound"; }
  go.disabled = false;
};

// ---------- EQ response display (offline filters only used for drawing) ----------
const dispF = eqTypes.map((t, i) => {
  const b = new OfflineAudioContext(1, 1, 44100).createBiquadFilter();
  b.type = t; b.frequency.value = P["eq" + i + "f"]; b.gain.value = P["eq" + i + "g"]; return b;
});
function setEq(i, param, v) { dispF[i][param].value = v; if (eqF[i]) eqF[i][param].value = v; drawEq(); }
function fit(cv) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  return [g, w, h];
}
function drawEq() {
  const [g, w, h] = fit(document.getElementById("cEq")), M = 200;
  const fr = new Float32Array(M), mag = new Float32Array(M), ph = new Float32Array(M), tot = new Float32Array(M).fill(1);
  for (let i = 0; i < M; i++) fr[i] = 20 * Math.pow(1000, i / (M - 1));
  dispF.forEach(f => { f.getFrequencyResponse(fr, mag, ph); for (let i = 0; i < M; i++) tot[i] *= mag[i]; });
  g.strokeStyle = "#cfd6dd"; g.lineWidth = 1; g.beginPath();
  for (const db of [-12, -6, 0, 6, 12]) { const y = h / 2 - db / 18 * (h / 2); g.moveTo(0, y); g.lineTo(w, y); }
  g.stroke();
  g.strokeStyle = "#c2410c"; g.lineWidth = 2.5; g.beginPath();
  for (let i = 0; i < M; i++) {
    const y = h / 2 - Math.max(-18, Math.min(18, 20 * Math.log10(tot[i]))) / 18 * (h / 2);
    i ? g.lineTo(i / (M - 1) * w, y) : g.moveTo(0, y);
  }
  g.stroke();
}

// ---------- scope ----------
const tb = new Float32Array(2048);
function drawScope() {
  const [g, w, h] = fit(document.getElementById("cScope"));
  g.strokeStyle = "#cfd6dd"; g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
  g.strokeStyle = "#c2410c"; g.lineWidth = 2; g.beginPath();
  if (ctx && an) {
    an.getFloatTimeDomainData(tb);
    for (let i = 0; i < tb.length; i++) {
      const y = h / 2 - Math.max(-1, Math.min(1, tb[i])) * (h / 2 - 4);
      i ? g.lineTo(i / (tb.length - 1) * w, y) : g.moveTo(0, y);
    }
  } else { g.moveTo(0, h / 2); g.lineTo(w, h / 2); }
  g.stroke();
}
setInterval(drawScope, 100);   // 10 fps

// ---------- sliders ----------
const ctl = {}, links = {}, lock = { L: true, R: true };
const setPos = (key, pos) => {
  const c = ctl[key]; c.pos = pos; c.input.value = Math.round(pos * 1000);
  let v = c.fromPos(pos); if (c.snap) v = Math.round(v);
  P[key] = v; c.out.textContent = c.fmt(v);
  if (c.apply) c.apply(v);
};
const addSliders = (box, list) => list.forEach(([key, label, lo, hi, log, fmt, apply, snap]) => {
  const row = document.createElement("div"); row.className = "ctl";
  const id = "s_" + key;
  const toPos = v => log ? Math.log(v / lo) / Math.log(hi / lo) : (v - lo) / (hi - lo);
  const fromPos = p => log ? lo * Math.pow(hi / lo, p) : lo + p * (hi - lo);
  row.innerHTML = `<label for="${id}">${label}</label>
    <input id="${id}" type="range" min="0" max="1000" value="${Math.round(toPos(P[key]) * 1000)}">
    <output>${fmt(P[key])}</output>`;
  const input = row.querySelector("input");
  ctl[key] = { input, out: row.querySelector("output"), fromPos, fmt, apply, snap, pos: toPos(P[key]) };
  input.oninput = () => {
    const p = input.value / 1000, c = ctl[key], L = links[key];
    if (L && L.on()) {                          // linked: both sliders travel the same distance
      const q = ctl[L.partner];
      const d = Math.max(-Math.min(c.pos, q.pos), Math.min(1 - Math.max(c.pos, q.pos), p - c.pos));
      setPos(key, c.pos + d); setPos(L.partner, q.pos + d);
    } else setPos(key, p);
  };
  box.appendChild(row);
});
const padlock = on => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="${on ? "M8 11V8a4 4 0 0 1 8 0v3" : "M8 11V8a4 4 0 0 1 7.5-2"}"/></svg>`;
function addLock(box, side, a, b) {
  const row = document.createElement("div"); row.className = "lock";
  const btn = document.createElement("button"); btn.type = "button";
  const name = side === "L" ? "left" : "right";
  const paint = () => {
    btn.innerHTML = padlock(lock[side]); btn.setAttribute("aria-pressed", String(lock[side]));
    btn.title = (lock[side] ? "Unlink" : "Link") + " min and max freq " + name; btn.setAttribute("aria-label", btn.title);
  };
  btn.onclick = () => { lock[side] = !lock[side]; paint(); };
  paint(); row.appendChild(btn); box.appendChild(row);
  links[a] = { partner: b, on: () => lock[side] };
  links[b] = { partner: a, on: () => lock[side] };
}
const f2 = v => v.toFixed(2), hz = v => (v < 10 ? v.toFixed(1) : Math.round(v)) + " Hz";
const gp = k => v => gendy && (gendy.parameters.get(k).value = v);

const oscBox = document.getElementById("oscCtls");
const fq = (k, label) => [[k, label, 1, 1000, true, hz, gp(k)]];
addSliders(oscBox, fq("minL", "Min freq left"));
addLock(oscBox, "L", "minL", "maxL");
addSliders(oscBox, fq("maxL", "Max freq left"));
addSliders(oscBox, fq("minR", "Min freq right"));
addLock(oscBox, "R", "minR", "maxR");
addSliders(oscBox, fq("maxR", "Max freq right"));
addSliders(oscBox, [
  ["ampscale", "Amp scale", 0, 1, false, f2, gp("ampscale")],
  ["durscale", "Dur scale", 0, 1, false, f2, gp("durscale")],
  ["knum",     "Knum",      10, 50, false, v => Math.round(v), gp("knum"), true],
  ["vol",      "Volume",    0, 1, false, f2, v => out && (out.gain.value = v)],
]);

const names = ["Low shelf", "Low mid", "High mid", "High shelf"];
const range = [[30, 300], [100, 1000], [500, 6000], [2000, 16000]];
const eqDefs = [];
names.forEach((nm, i) => {
  eqDefs.push(["eq" + i + "f", nm + " freq", range[i][0], range[i][1], true, hz, v => setEq(i, "frequency", v)]);
  eqDefs.push(["eq" + i + "g", nm + " gain", -15, 15, false, v => v.toFixed(1) + " dB", v => setEq(i, "gain", v)]);
});
addSliders(document.getElementById("eqCtls"), eqDefs);

addSliders(document.getElementById("rvCtls"), [
  ["rvMix",   "Mix",            0, 1, false, f2, setMix],
  ["rvDecay", "Decay (s)",      2, 25, true, v => v.toFixed(1), scheduleIR],
  ["rvPre",   "Pre-delay (ms)", 0, 250, false, v => Math.round(v) + " ms", v => dly && (dly.delayTime.value = v / 1000)],
  ["rvDamp",  "Damping",        800, 16000, true, hz, v => wHigh && (wHigh.frequency.value = v)],
  ["rvLow",   "Low cut",        20, 600, true, hz, v => wLow && (wLow.frequency.value = v)],
]);

addSliders(document.getElementById("lpCtls"), [
  ["lpFreq",  "Cutoff",     20, 20000, true, hz, setLpf],
  ["lpDepth", "Depth (dB)", 0, 60, false, v => (v < 0.5 ? "0" : "-" + Math.round(v)) + " dB", setLpf],
]);

window.addEventListener("resize", () => { drawEq(); drawScope(); });
drawEq(); drawScope();
</script>
</body>
</html>
